name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch zips
        run: |
          set -e
          command -v unzip >/dev/null || (sudo apt-get update -y && sudo apt-get install -y unzip)
          if [ -d patches ]; then
            for z in $(find patches -maxdepth 1 -name "*.zip" | sort); do
              echo "Applying patch: $z"
              unzip -o "$z" -d .
            done
          else
            echo "No patches/ directory -- nothing to apply"
          fi

      - name: Locate project root
        run: |
          set -e
          MATCH=$(find . -maxdepth 4 -name settings.gradle.kts | head -n1)
          if [ -z "$MATCH" ]; then
            echo "::error::Could not find settings.gradle.kts anywhere under the repo (searched 4 levels deep). The Android project isn't where this workflow expects -- check what actually got pushed."
            exit 1
          fi
          DIR=$(dirname "$MATCH")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project root resolved to: $DIR"

      - name: Fetch MiDaS model
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p app/src/main/assets/models
          curl -sL -o app/src/main/assets/models/midas_small.tflite \
            "https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite"
          echo "93d871071edff1218973ce25ee27ce95ccd20450c70a55e1b89efa3f5a772cdd  app/src/main/assets/models/midas_small.tflite" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip (fsrcnn conversion toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: fsrcnn-pip-${{ runner.os }}-v2

      - name: Convert FSRCNN checkpoint to TFLite
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          git clone --depth 1 https://github.com/suxrobGM/fsrcnn.git /tmp/fsrcnn-src

          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install onnx==1.19.1
          PYTHONPATH=/tmp/fsrcnn-src/src python tools/convert_fsrcnn_to_tflite.py \
            --checkpoint /tmp/fsrcnn-src/pretrained/fsrcnn_div2k.ckpt \
            --out /tmp/fsrcnn_div2k.onnx \
            --input-size 64

          pip install onnx2tf==1.29.24

          onnx2tf -i /tmp/fsrcnn_div2k.onnx -o /tmp/fsrcnn_saved_model

                   mkdir -p app/src/main/assets/models
          TFLITE_FILE=$(find /tmp/fsrcnn_saved_model -maxdepth 1 -name "*_float32.tflite" | head -n1)
          if [ -z "$TFLITE_FILE" ]; then
            echo "::error::No *_float32.tflite found in /tmp/fsrcnn_saved_model"
            ls -la /tmp/fsrcnn_saved_model
            exit 1
          fi
          cp "$TFLITE_FILE" app/src/main/assets/models/fsrcnn_div2k.tflite 

      - name: Grant execute
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew || true

      - name: Setup Gradle wrapper if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virtua-launcher-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
