name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No model binaries live in the repo -- the 66MB MiDaS file alone
      # clears GitHub's 25MB web-upload limit and chokes mobile git clients.
      # CI fetches it straight from the official source instead, verified
      # against a known-good checksum so a bad/incomplete download fails
      # loudly here rather than shipping a broken model in the APK.
      - name: Fetch MiDaS model
        run: |
          set -e
          mkdir -p app/src/main/assets/models
          curl -sL -o app/src/main/assets/models/midas_small.tflite \
            "https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite"
          echo "93d871071edff1218973ce25ee27ce95ccd20450c70a55e1b89efa3f5a772cdd  app/src/main/assets/models/midas_small.tflite" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip (fsrcnn conversion toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: fsrcnn-pip-${{ runner.os }}-v1

      - name: Convert FSRCNN checkpoint to TFLite
        run: |
          set -e
          git clone --depth 1 https://github.com/suxrobGM/fsrcnn.git /tmp/fsrcnn-src

          pip install --index-url https://download.pytorch.org/whl/cpu torch
          PYTHONPATH=/tmp/fsrcnn-src/src python tools/convert_fsrcnn_to_tflite.py \
            --checkpoint /tmp/fsrcnn-src/pretrained/fsrcnn_div2k.ckpt \
            --out /tmp/fsrcnn_div2k.onnx \
            --input-size 64

          pip install onnx2tf onnx onnxsim onnxruntime
          onnx2tf -i /tmp/fsrcnn_div2k.onnx -o /tmp/fsrcnn_saved_model

          mkdir -p app/src/main/assets/models
          cp /tmp/fsrcnn_saved_model/model_float32.tflite \
             app/src/main/assets/models/fsrcnn_div2k.tflite

      - name: Grant execute
        run: chmod +x gradlew || true

      - name: Setup Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virtua-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
